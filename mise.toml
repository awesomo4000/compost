[tools]
zig = "0.17.0"

[tasks.test]
run = "zig build test"

[tasks.demo]
run = "zig build demo"

[tasks.demo-vt]
description = "Replay text and a Kitty image through the terminal adapter"
run = "zig build demo-vt"

[tasks.shell]
description = "Run the interactive compositor desktop"
run = "zig build shell"

[tasks.test-host]
description = "Build and test the shell host in disposable PTYs"
run = ["zig build -Doptimize=fast", "python3 tests/shell_host.py", "python3 tests/keys_host.py", "python3 tests/startup_command_host.py", "python3 tests/tui_host.py", "python3 tests/floating_host.py", "python3 tests/borders_host.py", "python3 tests/desktop_host.py", "python3 tests/diagnostics_host.py", "python3 tests/pixel_mouse_host.py", "python3 tests/control_host.py", "python3 tests/control_windows.py", "python3 tests/control_cli.py", "python3 tests/startup_layout.py", "python3 tests/reload_layout.py", "python3 tests/cli_help.py", "python3 tests/window_navigation.py", "python3 tests/inactive_cursor.py", "python3 tests/cursor_updates.py", "python3 tests/scrollback_host.py", "python3 tests/clipboard_host.py"]

[tasks.deps-check]
description = "Check the rolling libghostty-vt asset and watched embedder hooks"
run = "python3 tools/deps-check.py"

[tasks.test-tmux-mouse]
description = "Test mouse forwarding through a disposable tmux server and compositor"
run = ["zig build -Doptimize=fast", "python3 tests/tmux_mouse_host.py"]

[tasks.test-tmux-keys]
description = "Test repeated arrow keys in an isolated tmux copy-mode session"
run = ["zig build -Doptimize=fast", "python3 tests/tmux_keys_host.py"]
